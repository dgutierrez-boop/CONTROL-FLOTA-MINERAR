<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minerar 2026 - Panel de Flota</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }
        .header {
            background: linear-gradient(135deg, #3b82f6, #1e40af);
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 25px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .logo { max-height: 70px; margin-bottom: 15px; border-radius: 10px; }
        .error-banner {
            background: #7f1d1d;
            color: #fca5a5;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 5px solid #f87171;
            display: none;
        }
        .error-banner.show { display: block; }
        .sucursales { 
            display: flex; 
            gap: 12px; 
            margin: 25px 0;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn-sucursal {
            padding: 12px 24px;
            border: 2px solid #3b82f6;
            background: #1e293b;
            color: white;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn-sucursal:hover { background: #334155; transform: translateY(-2px); }
        .btn-sucursal.active {
            background: #3b82f6;
            border-color: #60a5fa;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }
        .stat-card {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            border-left: 5px solid;
        }
        .stat-card.mal { border-color: #38bdf8; }
        .stat-card.brk { border-color: #a78bfa; }
        .stat-card.lpa { border-color: #4ade80; }
        .stat-value {
            font-size: 36px;
            font-weight: bold;
            margin: 10px 0;
        }
        .stat-label {
            color: #94a3b8;
            font-size: 13px;
            text-transform: uppercase;
        }
        .tabla-wrapper {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            overflow-x: auto;
        }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #334155;
        }
        th {
            background: #0f172a;
            color: #94a3b8;
            font-size: 12px;
            text-transform: uppercase;
        }
        .badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        .badge-activo { background: #065f46; color: #34d399; }
        .badge-parado { background: #92400e; color: #fbbf24; }
        .badge-service { background: #7f1d1d; color: #f87171; }
        .loading, .error-msg {
            text-align: center;
            padding: 40px;
            font-size: 16px;
        }
        .error-msg { color: #f87171; }
        .loading { color: #94a3b8; }
        .debug-info {
            background: #0f172a;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            font-family: monospace;
            font-size: 12px;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <div class="header">
        <img src="https://i.ibb.co/cKVCzpy7/Logo-Minerar-1.gif" alt="Minerar" class="logo">
        <h1>🚜 PANEL DE FLOTA MINERA 2026</h1>
        <p style="color: #94a3b8; margin-top: 8px;">Control de Horómetros - Tiempo Real</p>
    </div>

    <div id="errorBanner" class="error-banner">
        <strong>⚠️ Error de Conexión:</strong> <span id="errorMsg"></span>
        <div style="margin-top: 10px; font-size: 13px;">
            <strong>Solución:</strong> Verificá que las hojas estén publicadas en Google Sheets 
            (Archivo > Compartir > Publicar en la web > CSV)
        </div>
    </div>
    
    <div class="sucursales">
        <button class="btn-sucursal active" onclick="filtrarSucursal('TODAS', this)">🏭 Todas</button>
        <button class="btn-sucursal" onclick="filtrarSucursal('MALAGUEÑO', this)">📍 Malagueño</button>
        <button class="btn-sucursal" onclick="filtrarSucursal('BARKER', this)">🐺 Barker</button>
        <button class="btn-sucursal" onclick="filtrarSucursal('LA_PAMPITA', this)">🌸 La Pampita</button>
    </div>

    <div class="stats-grid" id="statsGrid">
        <div class="stat-card mal">
            <div class="stat-label">📍 Malagueño</div>
            <div class="stat-value" id="malCount">0</div>
        </div>
        <div class="stat-card brk">
            <div class="stat-label">🐺 Barker</div>
            <div class="stat-value" id="brkCount">0</div>
        </div>
        <div class="stat-card lpa">
            <div class="stat-label">🌸 La Pampita</div>
            <div class="stat-value" id="lpaCount">0</div>
        </div>
    </div>

    <div class="tabla-wrapper">
        <h2 style="margin-bottom: 15px;">📋 Flota en Tiempo Real</h2>
        <div id="contenidoTabla">
            <div class="loading">🔄 Cargando...</div>
        </div>
        <div id="debugInfo" class="debug-info" style="display: none;"></div>
    </div>

    <script>
        // ⚠️ REEMPLAZAR CON TUS URLs REALES PUBLICADAS
        const SHEETS = {
            'MALAGUEÑO': 'https://docs.google.com/spreadsheets/d/1c2w_a8U57_wMadGuQErHQeyPXHCnG9C9uxIr759qBTw/gviz/tq?tqx=out:csv&sheet=MALAGUEÑO',
            'LA_PAMPITA': 'https://docs.google.com/spreadsheets/d/1c2w_a8U57_wMadGuQErHQeyPXHCnG9C9uxIr759qBTw/gviz/tq?tqx=out:csv&sheet=LA_PAMPITA',
            'BARKER': 'https://docs.google.com/spreadsheets/d/1c2w_a8U57_wMadGuQErHQeyPXHCnG9C9uxIr759qBTw/gviz/tq?tqx=out:csv&sheet=BARKER'
        };

        let sucursalActual = 'TODAS';
        let todosLosDatos = [];

        function filtrarSucursal(sucursal, btn) {
            sucursalActual = sucursal;
            document.querySelectorAll('.btn-sucursal').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            aplicarFiltro();
        }

        function aplicarFiltro() {
            let datosFiltrados = todosLosDatos;
            if (sucursalActual !== 'TODAS') {
                datosFiltrados = todosLosDatos.filter(d => d.sucursal === sucursalActual);
            }
            mostrarTabla(datosFiltrados);
            actualizarStats(datosFiltrados);
        }

        function mostrarTabla(datos) {
            const contenedor = document.getElementById('contenidoTabla');
            
            if (datos.length === 0) {
                contenedor.innerHTML = '<div class="loading">📭 No hay datos disponibles</div>';
                return;
            }
            
            let html = `<table><thead><tr>
                <th>📍 Sucursal</th><th>🔢 ID</th><th>🚜 Equipo</th>
                <th>📊 Estado</th><th>⏱️ Horómetro</th><th>👷 Reportante</th>
            </tr></thead><tbody>`;
            
            datos.forEach(d => {
                const estado = (d.Estado || '').toUpperCase();
                let badgeClass = 'badge-activo';
                if (estado === 'PARADO') badgeClass = 'badge-parado';
                else if (estado === 'EN_SERVICE') badgeClass = 'badge-service';
                
                html += `<tr>
                    <td>${d.sucursal}</td>
                    <td><strong>${d.ID_Equipo || '-'}</strong></td>
                    <td>${d.Equipo || '-'}</td>
                    <td><span class="badge ${badgeClass}">${d.Estado || '-'}</span></td>
                    <td>${d['Horó./Kilómetro'] || '-'}</td>
                    <td>${d.Reportante || '-'}</td>
                </tr>`;
            });
            
            html += '</tbody></table>';
            contenedor.innerHTML = html;
        }

        function actualizarStats(datos) {
            const stats = { MALAGUEÑO: 0, BARKER: 0, LA_PAMPITA: 0 };
            datos.forEach(d => {
                if (stats.hasOwnProperty(d.sucursal) && (d.Estado || '').toUpperCase() === 'OPERATIVO') {
                    stats[d.sucursal]++;
                }
            });
            document.getElementById('malCount').textContent = stats.MALAGUEÑO;
            document.getElementById('brkCount').textContent = stats.BARKER;
            document.getElementById('lpaCount').textContent = stats.LA_PAMPITA;
        }

        async function cargarDatos() {
            const debugDiv = document.getElementById('debugInfo');
            const errorBanner = document.getElementById('errorBanner');
            const errorMsg = document.getElementById('errorMsg');
            
            try {
                todosLosDatos = [];
                let debugText = '📊 Intentando cargar hojas:\n\n';
                
                for (const [sucursal, url] of Object.entries(SHEETS)) {
                    try {
                        debugText += `⏳ ${sucursal}: ${url.substring(0, 80)}...\n`;
                        
                        const response = await fetch(url, { 
                            method: 'GET',
                            headers: { 'Accept': 'text/csv' }
                        });
                        
                        if (!response.ok) {
                            throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                        }
                        
                        const texto = await response.text();
                        const filas = parseCSV(texto);
                        
                        filas.forEach(fila => {
                            if (fila['ID_Equipo'] && fila['ID_Equipo'].trim()) {
                                todosLosDatos.push({ ...fila, sucursal: sucursal });
                            }
                        });
                        
                        debugText += `✅ ${sucursal}: ${filas.length} registros cargados\n\n`;
                        
                    } catch (err) {
                        debugText += `❌ ${sucursal}: ERROR - ${err.message}\n\n`;
                        console.error(`Error cargando ${sucursal}:`, err);
                    }
                }
                
                debugDiv.textContent = debugText;
                debugDiv.style.display = 'block';
                
                if (todosLosDatos.length === 0) {
                    errorBanner.classList.add('show');
                    errorMsg.textContent = 'No se pudieron cargar datos de ninguna hoja. Verificá que estén publicadas.';
                    document.getElementById('contenidoTabla').innerHTML = 
                        '<div class="error-msg">❌ No se pudieron cargar los datos<br>Verificá la consola (F12) para más detalles</div>';
                } else {
                    errorBanner.classList.remove('show');
                    aplicarFiltro();
                }
                
            } catch (error) {
                console.error('Error general:', error);
                errorBanner.classList.add('show');
                errorMsg.textContent = error.message;
            }
        }

        function parseCSV(texto) {
            const lineas = texto.trim().split('\n');
            if (lineas.length < 2) return [];
            
            const headers = lineas[0].split(',').map(h => h.trim().replace(/"/g, ''));
            const datos = [];
            
            for (let i = 1; i < lineas.length; i++) {
                if (!lineas[i].trim()) continue;
                const valores = lineas[i].split(',').map(v => v.trim().replace(/"/g, ''));
                const fila = {};
                headers.forEach((header, index) => {
                    fila[header] = valores[index] || '';
                });
                datos.push(fila);
            }
            return datos;
        }

        // Cargar al iniciar
        window.onload = () => cargarDatos();
        setInterval(cargarDatos, 60000); // Actualizar cada minuto
    </script>
</body>
</html>
