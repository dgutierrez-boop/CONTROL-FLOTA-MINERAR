let estadoChart = null, topParadosChart = null, motivosChart = null, sucursalesChart = null, trazabilidadChart = null;

let historialActual = [];

function playNotificationSound() {
    try {
        if (!window.audioCtx) window.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (window.audioCtx.state === 'suspended') window.audioCtx.resume();
        const osc = window.audioCtx.createOscillator();
        const gain = window.audioCtx.createGain();
        osc.connect(gain); gain.connect(window.audioCtx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, window.audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(440, window.audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.1, window.audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, window.audioCtx.currentTime + 0.3);
        osc.start(); osc.stop(window.audioCtx.currentTime + 0.3);
    } catch (e) {}
}
window.addEventListener('click', () => { if (window.audioCtx && window.audioCtx.state === 'suspended') window.audioCtx.resume(); }, { once: true });

function esIdEquipoValido(id) {
    if (!id) return false;
    const idLimpio = String(id).trim();
    return /^[A-Za-z0-9\-]+$/.test(idLimpio) && idLimpio.length >= 2;
}

// 🔥 PARSEO DE FECHA ROBUSTO
function parseFechaHora(fechaStr, horaStr) {
    try {
        if (!fechaStr || fechaStr === '-' || String(fechaStr).trim() === '') return 0;
        
        let fecha = String(fechaStr).trim();
        let hora = String(horaStr || '00:00').trim();
        
        // Separar fecha y hora si vienen juntas (ej: "2026-05-06 6:21:00")
        if (fecha.includes(' ') && !fecha.includes('T')) {
            const partes = fecha.split(' ');
            fecha = partes[0];
            if (partes[1] && partes[1].includes(':')) hora = partes[1];
        }
        
        // Formato ISO "2026-05-06" con hora separada
        if (fecha.match(/^\d{4}-\d{2}-\d{2}$/) && hora.includes(':')) {
            const d = new Date(fecha + 'T' + hora + ':00');
            if (!isNaN(d.getTime())) return d.getTime();
        }
        
        // Formato ISO con T
        if (fecha.includes('T')) {
            const d = new Date(fecha);
            if (!isNaN(d.getTime())) return d.getTime();
        }
        
        // Formato dd/mm/yyyy
        if (fecha.includes('/')) {
            const partes = fecha.split('/');
            if (partes.length === 3) {
                let day = parseInt(partes[0]);
                let month = parseInt(partes[1]) - 1;
                let year = parseInt(partes[2]);
                if (day === 0 || isNaN(day)) day = 1;
                if (year < 100) year += 2000;
                
                let h = 0, m = 0;
                if (hora && hora.includes(':')) {
                    const hp = hora.split(':');
                    h = parseInt(hp[0]) || 0;
                    m = parseInt(hp[1]) || 0;
                }
                
                const d = new Date(year, month, day, h, m, 0);
                if (!isNaN(d.getTime())) return d.getTime();
            }
        }
        
        // Último recurso
        const d = new Date(fecha);
        if (!isNaN(d.getTime())) return d.getTime();
        return 0;
    } catch (e) {
        return 0;
    }
}

function obtenerMesAnio(fechaStr) {
    if (!fechaStr) return 'N/A';
    const fecha = parseFechaHora(fechaStr, '00:00');
    if (!fecha) return 'N/A';
    const d = new Date(fecha);
    const meses = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
    return `${meses[d.getMonth()]}-${d.getFullYear().toString().substr(-2)}`;
}

function obtenerAnioMes(fechaStr) {
    const t = parseFechaHora(fechaStr, '00:00');
    if (!t) return null;
    const d = new Date(t);
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
}

// 🔥 PARSEO CSV CORRECTO QUE MANEJA COMILLAS MULTILÍNEA
function parseCSVCompleto(text) {
    const rows = [];
    let currentRow = [];
    let currentField = '';
    let inQuotes = false;
    let i = 0;
    
    while (i < text.length) {
        const char = text[i];
        const nextChar = text[i + 1];
        
        if (inQuotes) {
            if (char === '"' && nextChar === '"') {
                currentField += '"';
                i += 2;
                continue;
            } else if (char === '"') {
                inQuotes = false;
                i++;
                continue;
            } else {
                currentField += char;
                i++;
                continue;
            }
        } else {
            if (char === '"') {
                inQuotes = true;
                i++;
                continue;
            } else if (char === ',') {
                currentRow.push(currentField.trim());
                currentField = '';
                i++;
                continue;
            } else if (char === '\n' || (char === '\r' && nextChar === '\n')) {
                currentRow.push(currentField.trim());
                if (currentRow.length > 1 || (currentRow.length === 1 && currentRow[0] !== '')) {
                    rows.push(currentRow);
                }
                currentRow = [];
                currentField = '';
                if (char === '\r') i++;
                i++;
                continue;
            } else {
                currentField += char;
                i++;
            }
        }
    }
    
    // Última fila
    if (currentField || currentRow.length > 0) {
        currentRow.push(currentField.trim());
        rows.push(currentRow);
    }
    
    return rows;
}

function parseCSV(text, sucursal) {
    const rows = parseCSVCompleto(text);
    if (rows.length < 2) return [];
    
    const headers = rows[0].map(h => h.replace(/"/g, '').trim());
    const data = [];
    
    console.log(`📋 Headers de ${sucursal}:`, headers);
    
    for (let i = 1; i < rows.length; i++) {
        const values = rows[i];
        if (values.length === 0 || (values.length === 1 && values[0] === '')) continue;
        
        const row = {};
        headers.forEach((h, idx) => {
            row[h] = (values[idx] || '').replace(/^"|"$/g, '').trim();
        });
        
        const mapped = {
            ID_Equipo: (row['ID_Equipo'] || row['ID'] || row['id'] || values[0] || '').trim(),
            Equipo: (row['Equipo'] || row['equipo'] || row['Nombre'] || values[1] || '').trim(),
            Tipo_Equipo: (row['Tipo_Equipo'] || row['Tipo'] || row['tipo'] || values[2] || '').trim(),
            Propiedad: (row['Propiedad'] || row['propiedad'] || values[3] || '').trim().toUpperCase(),
            Estado: (row['Estado'] || row['estado'] || values[4] || '').trim(),
            Lectura: (row['Lectura'] || row['Horó./Kilómetro'] || row['lectura'] || values[6] || '').trim(),
            Motivo_Parada: (row['Motivo_Parada'] || row['Motivo'] || row['motivo'] || values[7] || '').trim(),
            Reportante: (row['Reportante'] || row['reportante'] || values[8] || '').trim(),
            Fecha_Carga: (row['Fecha_Carga'] || row['Fecha_Hora'] || row['fecha'] || values[9] || '').trim(),
            Hora_Carga: (row['Hora_Carga'] || row['hora'] || values[10] || '').trim(),
            Observaciones: (row['Observaciones'] || row['observaciones'] || values[11] || '').trim(),
            sucursal: sucursal
        };
        
        if (!esIdEquipoValido(mapped.ID_Equipo)) continue;
        
        if (mapped.Estado && mapped.Estado.toUpperCase().includes('FUERA DE SERVICIO')) {
            mapped.Estado = 'FUERA_DE_SERVICIO';
        } else if (mapped.Estado) {
            mapped.Estado = mapped.Estado.toUpperCase();
        }
        
        if (mapped.Estado !== 'OPERATIVO' && mapped.Estado !== 'FUERA_DE_SERVICIO' && mapped.Estado !== 'PARADO') {
            mapped.Estado = 'OPERATIVO';
        }
        
        // 🔥 Debug específico
        if (mapped.ID_Equipo === 'M403' || mapped.ID_Equipo === 'M443') {
            console.log(`✅ ${mapped.ID_Equipo} de ${sucursal}:`, {
                Fecha: mapped.Fecha_Carga,
                Hora: mapped.Hora_Carga,
                Reportante: mapped.Reportante,
                Estado: mapped.Estado,
                Motivo: mapped.Motivo_Parada.substring(0, 50)
            });
        }
        
        data.push(mapped);
    }
    
    console.log(`✅ ${sucursal}: ${data.length} registros cargados`);
    return data;
}

async function loadData() {
    try {
        if (isFirstLoad) {
            document.getElementById('equipmentTableBody').innerHTML = '<tr><td colspan="9" class="text-center text-cyan-300 p-4">🔄 Cargando...</td></tr>';
        }
        
        console.log('🔄 Iniciando carga de datos...');
        
        let allData = [];
        for (const [sucursal, url] of Object.entries(SHEETS_URLS)) {
            const data = await fetchSheet(url, sucursal);
            allData = allData.concat(data);
        }
        
        ALL_RAW_DATA = allData;
        
        const consolidado = {};
        allData.forEach(e => {
            const key = e.ID_Equipo + '_' + e.sucursal;
            const fechaActual = parseFechaHora(e.Fecha_Carga, e.Hora_Carga);
            const fechaExistente = consolidado[key] ? parseFechaHora(consolidado[key].Fecha_Carga, consolidado[key].Hora_Carga) : 0;
            if (!consolidado[key] || fechaActual >= fechaExistente) consolidado[key] = e;
        });
        
        EQUIPMENT_DATA = Object.values(consolidado);
        alertasHoy = detectarAlertasHoy(allData);
        
        actualizarFiltroEquipos();
        aplicarFiltros();
        updateAlertasUI();
        
    } catch (error) {
        console.error('❌ Error general:', error);
        if (isFirstLoad) {
            document.getElementById('equipmentTableBody').innerHTML = '<tr><td colspan="9" class="text-center text-red-400 p-4">❌ Error al cargar: ' + error.message + '</td></tr>';
        }
    }
    isFirstLoad = false;
}

function actualizarFiltroEquipos() {
    const select = document.getElementById('filterEquipo');
    const valorActual = select.value;
    
    const equiposFiltrados = currentSucursal === 'TODAS' ? EQUIPMENT_DATA : EQUIPMENT_DATA.filter(e => e.sucursal === currentSucursal);
    const equiposUnicos = {};
    equiposFiltrados.forEach(e => { if (!equiposUnicos[e.ID_Equipo]) equiposUnicos[e.ID_Equipo] = e; });
    
    const lista = Object.values(equiposUnicos).sort((a,b) => {
        const numA = parseInt(a.ID_Equipo.replace(/\D/g, '')) || 0;
        const numB = parseInt(b.ID_Equipo.replace(/\D/g, '')) || 0;
        if (numA !== numB) return numA - numB;
        return a.ID_Equipo.localeCompare(b.ID_Equipo);
    });
    
    select.innerHTML = '<option value="TODOS">🔎 Todos los equipos</option>';
    lista.forEach(e => {
        const opt = document.createElement('option');
        opt.value = e.ID_Equipo;
        opt.textContent = `${e.ID_Equipo} - ${e.Equipo ? e.Equipo.substring(0, 25) : ''}`;
        select.appendChild(opt);
    });
    
    if (valorActual && valorActual !== 'TODOS' && lista.some(e => e.ID_Equipo === valorActual)) {
        select.value = valorActual;
    } else {
        select.value = 'TODOS';
    }
}

async function fetchSheet(url, sucursal) {
    try {
        const response = await fetch(url + '&t=' + Date.now());
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const text = await response.text();
        return parseCSV(text, sucursal);
    } catch (error) {
        console.error(`❌ Error cargando ${sucursal}:`, error);
        return [];
    }
}

function detectarAlertasHoy(data) {
    const hoy = new Date();
    let hayNuevas = false;
    
    const consolidado = {};
    data.forEach(e => {
        const key = e.ID_Equipo + '_' + e.sucursal;
        const fechaActual = parseFechaHora(e.Fecha_Carga, e.Hora_Carga);
        const fechaExistente = consolidado[key] ? parseFechaHora(consolidado[key].Fecha_Carga, consolidado[key].Hora_Carga) : 0;
        if (!consolidado[key] || fechaActual >= fechaExistente) consolidado[key] = e;
    });
    
    const alertasDetectadas = Object.values(consolidado).filter(e => {
        if (!e.Fecha_Carga) return false;
        const t = parseFechaHora(e.Fecha_Carga, e.Hora_Carga);
        const d = new Date(t);
        return d.getDate() == hoy.getDate() && d.getMonth() == hoy.getMonth() && d.getFullYear() == hoy.getFullYear();
    }).map(e => ({
        id: e.ID_Equipo, equipo: e.Equipo, sucursal: e.sucursal,
        reportante: e.Reportante || 'Sin reportante', estado: e.Estado,
        hora: e.Hora_Carga || '00:00',
        uniqueKey: `${e.ID_Equipo}-${e.sucursal}-${e.Fecha_Carga}-${e.Hora_Carga}`
    }));
    
    alertasDetectadas.forEach(a => {
        if (!knownAlertIds.has(a.uniqueKey)) {
            knownAlertIds.add(a.uniqueKey);
            if (!isFirstLoad) hayNuevas = true;
        }
    });
    
    if (hayNuevas) playNotificationSound();
    return alertasDetectadas;
}

function updateAlertasUI() {
    const container = document.getElementById('alertasHoy');
    let alertasFiltradas = alertasHoy;
    if (currentSucursal !== 'TODAS') alertasFiltradas = alertasFiltradas.filter(a => a.sucursal === currentSucursal);
    if (currentEquipoFiltro !== 'TODOS') alertasFiltradas = alertasFiltradas.filter(a => a.id === currentEquipoFiltro);
    
    if (alertasFiltradas.length === 0) {
        container.innerHTML = '<p class="text-cyan-200 text-center py-2">Sin alertas</p>';
        return;
    }
    container.innerHTML = alertasFiltradas.map(a => `
        <div class="alert-item" onclick="openEquipmentModalById('${a.id}','${a.sucursal}')">
            <div class="flex justify-between items-start mb-1">
                <span class="font-bold text-cyan-300">${a.id}</span>
                <span class="text-[9px] text-slate-400">${a.hora}</span>
            </div>
            <div class="text-[10px] text-cyan-200 truncate">${a.equipo}</div>
            <div class="text-[10px] text-slate-400">👤 ${a.reportante}</div>
        </div>
    `).join('');
}

function openEquipmentModalById(id, sucursal) {
    const equipo = EQUIPMENT_DATA.find(e => e.ID_Equipo === id && e.sucursal === sucursal);
    if (equipo) openEquipmentModal(equipo);
}

function cambiarSucursal(sucursal) {
    currentSucursal = sucursal;
    document.querySelectorAll('.sucursal-btn').forEach(btn => btn.classList.remove('active'));
    document.getElementById(sucursal === 'TODAS' ? 'btnTodas' : sucursal === 'MALAGUENO' ? 'btnMalagueno' : sucursal === 'BARKER' ? 'btnBarker' : 'btnPampita').classList.add('active');
    
    document.getElementById('filterPropiedad').value = 'TODAS';
    document.getElementById('filterEquipo').value = 'TODOS';
    document.getElementById('filterEstado').value = 'TODOS';
    currentEquipoFiltro = 'TODOS';
    
    actualizarFiltroEquipos();
    aplicarFiltros();
    updateAlertasUI();
}

function volverAModoActual() {
    document.getElementById('filterMes').value = 'ACTUAL';
    currentMesFiltro = 'ACTUAL';
    aplicarFiltros();
}

function aplicarFiltros() {
    const propiedad = document.getElementById('filterPropiedad').value;
    const equipo = document.getElementById('filterEquipo').value;
    const estado = document.getElementById('filterEstado').value;
    currentEquipoFiltro = equipo;
    currentMesFiltro = document.getElementById('filterMes').value;
    
    let datosBase = EQUIPMENT_DATA;
    if (currentMesFiltro !== 'ACTUAL') {
        datosBase = calcularEstadoPorMes(ALL_RAW_DATA, currentMesFiltro);
    }
    
    filteredData = datosBase.filter(e => {
        const matchSucursal = currentSucursal === 'TODAS' || e.sucursal === currentSucursal;
        const matchPropiedad = propiedad === 'TODAS' || (e.Propiedad || '').toUpperCase() === propiedad;
        const matchEquipo = equipo === 'TODOS' || e.ID_Equipo === equipo;
        let matchEstado = true;
        if (estado === 'OPERATIVO') matchEstado = e.Estado === 'OPERATIVO';
        else if (estado === 'PARADO') matchEstado = e.Estado === 'FUERA_DE_SERVICIO' || e.Estado === 'PARADO';
        return matchSucursal && matchPropiedad && matchEquipo && matchEstado;
    });
    
    actualizarBannerHistorico();
    updateDashboard();
    updateAlertasUI();
}

function calcularEstadoPorMes(todosLosDatos, anioMes) {
    const registrosDelMes = todosLosDatos.filter(e => obtenerAnioMes(e.Fecha_Carga) === anioMes);
    const consolidado = {};
    registrosDelMes.forEach(e => {
        const key = e.ID_Equipo + '_' + e.sucursal;
        const fechaActual = parseFechaHora(e.Fecha_Carga, e.Hora_Carga);
        const fechaExistente = consolidado[key] ? parseFechaHora(consolidado[key].Fecha_Carga, consolidado[key].Hora_Carga) : 0;
        if (!consolidado[key] || fechaActual >= fechaExistente) {
            consolidado[key] = e;
        }
    });
    return Object.values(consolidado);
}

function actualizarBannerHistorico() {
    const banner = document.getElementById('bannerHistorico');
    const label = document.getElementById('labelMesHistorico');
    
    if (currentMesFiltro === 'ACTUAL') {
        banner.style.display = 'none';
    } else {
        banner.style.display = 'flex';
        label.innerText = NOMBRES_MESES[currentMesFiltro] || currentMesFiltro;
    }
}

function updateDashboard() {
    updateKPIsHeader();
    updateKPIs();
    updateCharts();
    updateTrazabilidadChart();
    renderTable();
}

function updateKPIsHeader() {
    const total = filteredData.length;
    const parados = filteredData.filter(e => e.Estado === 'FUERA_DE_SERVICIO' || e.Estado === 'PARADO').length;
    
    let totalHsPerdidas = 0;
    filteredData.forEach(e => {
        if (e.Estado === 'FUERA_DE_SERVICIO' || e.Estado === 'PARADO') {
            if (currentMesFiltro !== 'ACTUAL') {
                totalHsPerdidas += 1;
            } else {
                const t = calcularTiempoParado(e.Fecha_Carga, e.Hora_Carga);
                if (t && t.totalHs > 0) totalHsPerdidas += t.totalHs;
            }
        }
    });
    
    document.getElementById('totalEquipos').innerText = total;
    document.getElementById('totalParados').innerText = parados;
    document.getElementById('totalHsPerdidas').innerText = 
        currentMesFiltro !== 'ACTUAL' ? totalHsPerdidas + ' paradas' : Math.round(totalHsPerdidas) + 'h';
}

function updateKPIs() {
    const container = document.getElementById('kpiContainer');
    const esEquipoEspecifico = currentEquipoFiltro !== 'TODOS';
    const equipoSeleccionado = esEquipoEspecifico ? filteredData.find(e => e.ID_Equipo === currentEquipoFiltro) : null;
    
    if (esEquipoEspecifico && equipoSeleccionado) {
        const esParado = equipoSeleccionado.Estado === 'FUERA_DE_SERVICIO' || equipoSeleccionado.Estado === 'PARADO';
        const t = currentMesFiltro === 'ACTUAL' ? calcularTiempoParado(equipoSeleccionado.Fecha_Carga, equipoSeleccionado.Hora_Carga) : null;
        const historial = ALL_RAW_DATA.filter(e => e.ID_Equipo === equipoSeleccionado.ID_Equipo);
        const paradasCount = historial.filter(e => e.Estado === 'FUERA_DE_SERVICIO' || e.Estado === 'PARADO').length;
        const operativosCount = historial.filter(e => e.Estado === 'OPERATIVO').length;
        
        container.innerHTML = `
            <div class="glass-card p-4 ${esParado ? 'kpi-red' : 'kpi-green'}">
                <div class="text-xs font-bold ${esParado ? 'text-red-400' : 'text-green-400'} mb-1">📊 ESTADO ACTUAL</div>
                <div class="text-2xl font-black ${esParado ? 'text-red-300' : 'text-green-300'}">${esParado ? '⏸️ PARADO' : '✅ OPERATIVO'}</div>
                <div class="kpi-subtitulo text-${esParado ? 'red' : 'green'}-200">Último registro: ${equipoSeleccionado.Fecha_Carga || '-'}</div>
            </div>
            <div class="glass-card p-4 kpi-amber">
                <div class="text-xs font-bold text-amber-400 mb-1">⏱️ TIEMPO PARADO</div>
                <div class="kpi-valor text-2xl font-black text-amber-300">
                    ${t ? (t.dias > 0 ? `${t.dias}d ` : '') + `${t.horas}h ${t.minutos}m` : '-'}
                </div>
                <div class="kpi-subtitulo text-amber-200">${esParado ? 'Desde última carga' : 'En servicio'}</div>
            </div>
            <div class="glass-card p-4 kpi-cyan">
                <div class="text-xs font-bold text-cyan-400 mb-1">🔢 LECTURA ACTUAL</div>
                <div class="kpi-valor text-2xl font-black text-cyan-300">${equipoSeleccionado.Lectura || '0'}</div>
                <div class="kpi-subtitulo text-cyan-200">${equipoSeleccionado.Tipo_Equipo || 'Equipo'}</div>
            </div>
            <div class="glass-card p-4 kpi-purple">
                <div class="text-xs font-bold text-purple-400 mb-1">📜 HISTORIAL</div>
                <div class="kpi-valor text-2xl font-black text-purple-300">${historial.length}</div>

            </div>
        `;
    } else {
        const total = filteredData.length;
        const operativos = filteredData.filter(e => e.Estado === 'OPERATIVO').length;
        const parados = filteredData.filter(e => e.Estado === 'FUERA_DE_SERVICIO' || e.Estado === 'PARADO').length;
        
        let totalHsPerdidas = 0;
        let equipoCritico = null, maxHs = 0;
        
        filteredData.forEach(e => {
            if (e.Estado === 'FUERA_DE_SERVICIO' || e.Estado === 'PARADO') {
                if (currentMesFiltro !== 'ACTUAL') {
                    totalHsPerdidas += 1;
                    if (1 > maxHs) { maxHs = 1; equipoCritico = e; }
                } else {
                    const t = calcularTiempoParado(e.Fecha_Carga, e.Hora_Carga);
                    if (t && t.totalHs > 0) {
                        totalHsPerdidas += t.totalHs;
                        if (t.totalHs > maxHs) { maxHs = t.totalHs; equipoCritico = e; }
                    }
                }
            }
        });
        
        const disponibilidad = total > 0 ? Math.round(operativos/total*100) : 0;
        const promParada = parados > 0 ? Math.round(totalHsPerdidas / parados) : 0;
        
        container.innerHTML = `
            <div class="glass-card p-4 kpi-green">
                <div class="text-xs font-bold text-green-400 mb-1">✅ DISPONIBILIDAD</div>

            </div>
            <div class="glass-card p-4 kpi-cyan">
                <div class="text-xs font-bold text-cyan-400 mb-1">🟢 OPERATIVOS</div>
                <div class="kpi-valor text-3xl font-black text-cyan-300">${operativos}</div>
                <div class="kpi-subtitulo text-cyan-200">De ${total} totales · ${parados} parados</div>
            </div>
            <div class="glass-card p-4 kpi-amber">

                <div class="kpi-valor text-3xl font-black text-amber-300">${currentMesFiltro !== 'ACTUAL' ? totalHsPerdidas : Math.round(totalHsPerdidas) + 'h'}</div>
                <div class="kpi-subtitulo text-amber-200">${currentMesFiltro !== 'ACTUAL' ? NOMBRES_MESES[currentMesFiltro] : 'Acumulado actualmente'}</div>
            </div>
            <div class="glass-card p-4 kpi-red">
                <div class="text-xs font-bold text-red-400 mb-1">🚨 ${currentMesFiltro !== 'ACTUAL' ? 'EQUIPO DEL MES' : 'EQUIPO CRÍTICO'}</div>
                <div class="kpi-valor text-xl font-black text-red-300 truncate">${equipoCritico ? equipoCritico.ID_Equipo : '-'}</div>
                <div class="kpi-subtitulo text-red-200">${equipoCritico ? (currentMesFiltro !== 'ACTUAL' ? `Parado en ${NOMBRES_MESES[currentMesFiltro]}` : `${Math.floor(maxHs/24)}d ${Math.floor(maxHs%24)}h parado`) : 'Sin paradas'}</div>
            </div>
            <div class="glass-card p-4 kpi-purple">
                <div class="text-xs font-bold text-purple-400 mb-1">📊 ${currentMesFiltro !== 'ACTUAL' ? 'ACTIVIDAD MES' : 'PROM. PARADA'}</div>
                <div class="kpi-valor text-3xl font-black text-purple-300">${currentMesFiltro !== 'ACTUAL' ? filteredData.length + ' eq.' : promParada + 'h'}</div>
                <div class="kpi-subtitulo text-purple-200">${currentMesFiltro !== 'ACTUAL' ? 'Equipos registrados' : 'Por equipo parado'}</div>
            </div>
        `;
    }
}

function calcularTiempoParado(fechaStr, horaStr) {
    try {
        const fechaParada = parseFechaHora(fechaStr, horaStr);
        if (!fechaParada || fechaParada === 0) return null;
        
        const ahora = new Date().getTime();
        const diffMs = ahora - fechaParada;
        if (diffMs < 0) return null;
        
        const dias = Math.floor(diffMs / (1000 * 60 * 60 * 24));
        const horas = Math.floor((diffMs % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutos = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
        
        return { dias, horas, minutos, totalHs: diffMs / (1000 * 60 * 60) };
    } catch (e) {
        return null;
    }
}

function actualizarCronometros() {
    if (currentMesFiltro !== 'ACTUAL') return;
    
    document.querySelectorAll('[data-fecha-parada]').forEach(el => {
        const fecha = el.getAttribute('data-fecha-parada');
        const hora = el.getAttribute('data-hora-parada') || '00:00';
        const t = calcularTiempoParado(fecha, hora);
        if (t) {
            let html = '⏱️ ';
            if (t.dias > 0) html += `<span class="crono-dia">${t.dias}d</span> `;
            html += `<span class="crono-hora">${t.horas}h</span> `;
            html += `<span class="crono-min">${t.minutos}m</span>`;
            el.innerHTML = html;
        }
    });
}
setInterval(actualizarCronometros, 10000);

function updateTrazabilidadChart() {
    const equiposUnicos = {};
    
    ALL_RAW_DATA.forEach(e => {
        if (!e.ID_Equipo || !e.Fecha_Carga || !e.Lectura) return;
        
        const fecha = parseFechaHora(e.Fecha_Carga, e.Hora_Carga || '00:00');
        if (!fecha) return;
        
        if (!equiposUnicos[e.ID_Equipo]) {
            equiposUnicos[e.ID_Equipo] = [];
        }
        
        const d = new Date(fecha);
        const meses = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
        const mesLabel = `${meses[d.getMonth()]}-${d.getFullYear().toString().substr(-2)}`;
        
        equiposUnicos[e.ID_Equipo].push({
            fecha: fecha,
            lectura: parseFloat(e.Lectura) || 0,
            mesLabel: mesLabel
        });
    });
    
    Object.keys(equiposUnicos).forEach(id => {
        equiposUnicos[id].sort((a, b) => a.fecha - b.fecha);
    });
    
    const todosLosMeses = new Set();
    Object.values(equiposUnicos).forEach(datos => {
        datos.forEach(d => todosLosMeses.add(d.mesLabel));
    });
    const mesesOrdenados = Array.from(todosLosMeses).sort((a, b) => {
        const [mesA, anioA] = a.split('-');
        const [mesB, anioB] = b.split('-');
        const meses = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
        const ordenA = parseInt(anioA) * 12 + meses.indexOf(mesA);
        const ordenB = parseInt(anioB) * 12 + meses.indexOf(mesB);
        return ordenA - ordenB;
    });
    
    const equiposOrdenados = Object.keys(equiposUnicos)
        .map(id => ({ id, total: equiposUnicos[id].length }))
        .sort((a, b) => b.total - a.total)
        .slice(0, 8)
        .map(e => e.id);
    
    const colors = ['#06b6d4', '#f59e0b', '#10b981', '#ef4444', '#8b5cf6', '#ec4899', '#f97316', '#14b8a6'];
    
    const datasets = equiposOrdenados.map((idEquipo, index) => {
        const datosEquipo = equiposUnicos[idEquipo];
        const data = mesesOrdenados.map(mes => {
            const registro = datosEquipo.find(d => d.mesLabel === mes);
            return registro ? registro.lectura : null;
        });
        
        return {
            label: `🔧 ${idEquipo}`,
            data: data,
            borderColor: colors[index % colors.length],
            backgroundColor: colors[index % colors.length] + '20',
            tension: 0.4,
            fill: false,
            pointRadius: 5,
            pointHoverRadius: 8,
            pointBackgroundColor: colors[index % colors.length],
            borderWidth: 2
        };
    });
    
    const ctx = document.getElementById('trazabilidadChart');
    if (!ctx) return;
    if (trazabilidadChart) trazabilidadChart.destroy();
    
    trazabilidadChart = new Chart(ctx.getContext('2d'), {
        type: 'line',
        data: { labels: mesesOrdenados, datasets: datasets },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: {
                legend: { position: 'top', labels: { color: '#cbd5e1', font: { size: 10 }, boxWidth: 12, padding: 10 } },
                tooltip: {
                    backgroundColor: 'rgba(15, 23, 42, 0.9)',
                    titleColor: '#06b6d4',
                    bodyColor: '#e2e8f0',
                    callbacks: { label: (context) => `${context.dataset.label}: ${context.parsed.y.toLocaleString()} hs` }
                }
            },
            scales: {
                x: { grid: { color: 'rgba(100,100,150,0.1)' }, ticks: { color: '#cbd5e1', font: { size: 9 }, maxRotation: 45, minRotation: 45 } },
                y: { beginAtZero: false, grid: { color: 'rgba(100,100,150,0.1)' }, ticks: { color: '#cbd5e1', font: { size: 10 }, callback: (v) => v.toLocaleString() + 'h' } }
            }
        }
    });
}

                <div class="flex items-center justify-between mt-4 gap-2">
                    <button onclick="cambiarRegistroHistorial(-1)" id="btnAnterior" class="flex-1 bg-slate-700 hover:bg-slate-600 text-white px-3 py-2 rounded-lg text-xs font-bold transition-all ${totalRegistros <= 1 ? 'opacity-30 cursor-not-allowed' : ''}" ${totalRegistros <= 1 ? 'disabled' : ''}>← Anterior registro</button>
                    <div class="flex gap-1 items-center" id="historialDots">${generarDotsHistorial(totalRegistros, 0)}</div>
                    <button onclick="cambiarRegistroHistorial(1)" id="btnSiguiente" class="flex-1 bg-cyan-600 hover:bg-cyan-500 text-white px-3 py-2 rounded-lg text-xs font-bold transition-all ${totalRegistros <= 1 ? 'opacity-30 cursor-not-allowed' : ''}" ${totalRegistros <= 1 ? 'disabled' : ''}>Siguiente registro →</button>
                </div>
            </div>
        `;
    }
    
    const motivoCompleto = equipo.Motivo_Parada || '';
    const observacionesCompletas = equipo.Observaciones || '';
    
    content.innerHTML = `
        ${bannerModal}
        <div class="grid grid-cols-2 gap-3 mb-4">
            <div class="bg-slate-800 p-4 rounded-xl border border-cyan-500/30"><div class="text-xs text-slate-400 mb-1">🔢 ID</div><div class="text-xl font-bold text-cyan-300">${equipo.ID_Equipo}</div></div>
            <div class="bg-slate-800 p-4 rounded-xl border border-cyan-500/30"><div class="text-xs text-slate-400 mb-1">🚜 Equipo</div><div class="text-base font-bold text-white">${equipo.Equipo}</div></div>
            <div class="bg-slate-800 p-4 rounded-xl border border-cyan-500/30"><div class="text-xs text-slate-400 mb-1">🏷️ Tipo</div><div class="text-sm font-bold text-white">${equipo.Tipo_Equipo || '-'}</div></div>
            <div class="bg-slate-800 p-4 rounded-xl border border-cyan-500/30"><div class="text-xs text-slate-400 mb-1">🏢 Propiedad</div><div class="text-sm font-bold text-white">${equipo.Propiedad || '-'}</div></div>
        </div>
        ${cronometroHTML}
        <div class="space-y-2 mt-4">
            <div class="flex justify-between p-3 bg-slate-800/50 rounded-lg"><span class="text-slate-400">📍 Sucursal</span><span class="font-bold text-cyan-300">${equipo.sucursal}</span></div>
            <div class="flex justify-between p-3 bg-slate-800/50 rounded-lg"><span class="text-slate-400">📊 Estado</span><span class="font-bold ${esParado ? 'text-amber-300' : 'text-green-300'}">${equipo.Estado}</span></div>
            <div class="flex justify-between p-3 bg-slate-800/50 rounded-lg"><span class="text-slate-400">📈 Lectura</span><span class="font-bold text-amber-300">${equipo.Lectura || 'N/A'}</span></div>
            <div class="flex justify-between p-3 bg-slate-800/50 rounded-lg"><span class="text-slate-400">📅 Último registro</span><span class="font-bold text-cyan-300">${equipo.Fecha_Carga || '-'} ${equipo.Hora_Carga || ''}</span></div>
            ${motivoCompleto ? `<div class="p-3 bg-amber-950/20 rounded-lg border border-amber-500/30"><div class="text-xs text-amber-400 mb-1">⚠️ Motivo</div><div class="text-sm text-slate-300 modal-texto-completo">${motivoCompleto}</div></div>` : ''}
            ${observacionesCompletas ? `<div class="p-3 bg-slate-800/50 rounded-lg"><div class="text-xs text-slate-400 mb-1">📝 Observaciones</div><div class="text-sm text-slate-300 modal-texto-completo">${observacionesCompletas}</div></div>` : ''}
        </div>
        ${sliderHTML}
    `;
}

function renderizarSlideHistorial(reg, indice) {
    const esOp = reg.Estado === 'OPERATIVO';
    const estadoColor = esOp ? 'text-green-400' : 'text-amber-400';
    const estadoIcon = esOp ? '✅' : '⏸️';
    const estadoTexto = esOp ? 'OPERATIVO' : 'PARADO';
    const badgeBorder = esOp ? 'border-green-500/50' : 'border-amber-500/50';
    const badgeBg = esOp ? 'bg-green-950/20' : 'bg-amber-950/20';
    
    let diffHs = '';
    if (indice < historialActual.length - 1) {
        const regAnterior = historialActual[indice + 1];
        const lectActual = parseFloat(reg.Lectura) || 0;
        const lectAnterior = parseFloat(regAnterior.Lectura) || 0;
        const diff = lectActual - lectAnterior;
        if (diff > 0) diffHs = `<div class="text-[10px] text-cyan-400 mt-1">↗️ +${diff.toFixed(1)} desde anterior</div>`;
    }
    
    let diffTiempo = '';
    if (indice < historialActual.length - 1) {
        const regAnterior = historialActual[indice + 1];
        const tActual = parseFechaHora(reg.Fecha_Carga, reg.Hora_Carga);
        const tAnterior = parseFechaHora(regAnterior.Fecha_Carga, regAnterior.Hora_Carga);
        if (tActual > 0 && tAnterior > 0) {
            const diffMs = tActual - tAnterior;
            const dias = Math.floor(diffMs / (1000 * 60 * 60 * 24));
            const hs = Math.floor((diffMs % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            if (dias > 0 || hs > 0) diffTiempo = `<div class="text-[10px] text-purple-400">⏱️ ${dias > 0 ? dias + 'd ' : ''}${hs}h desde anterior</div>`;
        }
    }
    
    const fechaDisplay = reg.Fecha_Carga ? `${reg.Fecha_Carga} ${reg.Hora_Carga || ''}` : 'Sin fecha';
    
    return `
        <div class="${badgeBg} border ${badgeBorder} rounded-lg p-3">
            <div class="flex justify-between items-center mb-2">
                <span class="font-bold ${estadoColor} text-sm">${estadoIcon} ${estadoTexto}</span>
                <span class="text-[11px] text-slate-400 font-mono bg-slate-900/50 px-2 py-1 rounded">📅 ${fechaDisplay}</span>
            </div>
            <div class="grid grid-cols-2 gap-2 mb-2">
                <div class="bg-slate-900/50 rounded-lg p-2"><div class="text-[9px] text-slate-500">🔢 HORÓMETRO</div><div class="text-lg font-black text-amber-300">${reg.Lectura || 'N/A'}</div>${diffHs}</div>
                <div class="bg-slate-900/50 rounded-lg p-2"><div class="text-[9px] text-slate-500">👤 REPORTANTE</div><div class="text-sm font-bold text-cyan-300">${reg.Reportante || 'N/A'}</div>${diffTiempo}</div>
            </div>
            ${reg.Motivo_Parada ? `<div class="bg-slate-900/50 rounded-lg p-2 mt-2"><div class="text-[9px] text-amber-400 mb-1">⚠️ MOTIVO</div><div class="text-xs text-slate-300 leading-relaxed modal-texto-completo">${reg.Motivo_Parada}</div></div>` : ''}
        </div>
    `;
}

function generarDotsHistorial(total, actual) {
    if (total <= 10) {
        let html = '';
        for (let i = 0; i < total; i++) {
            html += `<div class="w-2 h-2 rounded-full transition-all ${i === actual ? 'bg-cyan-400 w-4' : 'bg-slate-600'}"></div>`;
        }
        return html;
    } else {
        const porcentaje = ((actual + 1) / total) * 100;
        return `<div class="flex-1 mx-2 h-1.5 bg-slate-700 rounded-full overflow-hidden"><div class="h-full bg-cyan-400 transition-all" style="width: ${porcentaje}%"></div></div>`;
    }
}

function cambiarRegistroHistorial(direccion) {
    const nuevoIndice = indiceHistorial + direccion;
    if (nuevoIndice < 0 || nuevoIndice >= historialActual.length) return;
    indiceHistorial = nuevoIndice;
    const reg = historialActual[indiceHistorial];
    const slide = document.getElementById('historialSlide');
    slide.style.opacity = '0';
    slide.style.transform = direccion > 0 ? 'translateX(20px)' : 'translateX(-20px)';
    setTimeout(() => {
        slide.innerHTML = renderizarSlideHistorial(reg, indiceHistorial);
        slide.style.transform = direccion > 0 ? 'translateX(-20px)' : 'translateX(20px)';
        setTimeout(() => { slide.style.opacity = '1'; slide.style.transform = 'translateX(0)'; }, 50);
    }, 150);
    document.getElementById('historialContador').innerText = `${indiceHistorial + 1} de ${historialActual.length}`;
    document.getElementById('historialDots').innerHTML = generarDotsHistorial(historialActual.length, indiceHistorial);
    const btnAnt = document.getElementById('btnAnterior');
    const btnSig = document.getElementById('btnSiguiente');
    btnAnt.disabled = indiceHistorial === 0;
    btnAnt.classList.toggle('opacity-30', indiceHistorial === 0);
    btnAnt.classList.toggle('cursor-not-allowed', indiceHistorial === 0);
    btnSig.disabled = indiceHistorial === historialActual.length - 1;
    btnSig.classList.toggle('opacity-30', indiceHistorial === historialActual.length - 1);
    btnSig.classList.toggle('cursor-not-allowed', indiceHistorial === historialActual.length - 1);
}

function navegarEquipo(direccion) {
    const nuevoIndice = indiceEquipoModal + direccion;
    if (nuevoIndice < 0 || nuevoIndice >= filteredData.length) return;
    indiceEquipoModal = nuevoIndice;
    const content = document.getElementById('modalContent');
    content.style.opacity = '0';
    content.style.transform = direccion > 0 ? 'translateX(30px)' : 'translateX(-30px)';
    setTimeout(() => {
        renderizarContenidoModal();
        content.style.transform = direccion > 0 ? 'translateX(-30px)' : 'translateX(30px)';
        setTimeout(() => { content.style.opacity = '1'; content.style.transform = 'translateX(0)'; }, 50);
    }, 150);
}

function closeEquipmentModal() {
    document.getElementById('equipmentModal').classList.add('hidden');
    document.getElementById('equipmentModal').style.display = 'none';
}

function forceRefreshData() { 
    knownAlertIds.clear(); 
    loadData(); 
}

document.addEventListener('keydown', (e) => {
    const modal = document.getElementById('equipmentModal');
    if (modal.classList.contains('hidden')) return;
    if (e.key === 'Escape') closeEquipmentModal();
    if (e.key === 'ArrowLeft') { e.preventDefault(); navegarEquipo(-1); }
    if (e.key === 'ArrowRight') { e.preventDefault(); navegarEquipo(1); }
});

window.onload = () => { loadData(); setInterval(loadData, 60000); actualizarCronometros(); };
</script>
</body>
