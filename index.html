<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minerar 2026 - Panel de Flota</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: Arial, sans-serif; 
            background: #1e293b;
            color: white;
            padding: 20px;
        }
        .header {
            background: linear-gradient(135deg, #3b82f6, #1e40af);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }
        .logo { max-height: 60px; margin-bottom: 10px; }
        .sucursales { 
            display: flex; 
            gap: 10px; 
            margin-bottom: 20px;
            justify-content: center;
        }
        .btn-sucursal {
            padding: 10px 20px;
            border: 2px solid #3b82f6;
            background: #1e293b;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-sucursal.active {
            background: #3b82f6;
        }
        .tabla-container {
            background: #0f172a;
            padding: 20px;
            border-radius: 10px;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #334155;
        }
        th {
            background: #1e293b;
            color: #94a3b8;
            font-size: 12px;
            text-transform: uppercase;
        }
        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
        .badge-activo { background: #065f46; color: #34d399; }
        .badge-parado { background: #92400e; color: #fbbf24; }
        .badge-service { background: #7f1d1d; color: #f87171; }
        .loading {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <div class="header">
        <img src="https://i.ibb.co/cKVCzpy7/Logo-Minerar-1.gif" alt="Minerar" class="logo">
        <h1>🚜 PANEL DE FLOTA MINERA 2026</h1>
        <p>Control de Horómetros y Kilómetros</p>
    </div>
    
    <div class="sucursales">
        <button class="btn-sucursal active" onclick="cargarSucursal('TODAS')">🏭 Todas</button>
        <button class="btn-sucursal" onclick="cargarSucursal('MALAGUEÑO')">📍 Malagueño</button>
        <button class="btn-sucursal" onclick="cargarSucursal('BARKER')">🐺 Barker</button>
        <button class="btn-sucursal" onclick="cargarSucursal('LA_PAMPITA')">🌸 La Pampita</button>
    </div>
    
    <div class="tabla-container">
        <h2 style="margin-bottom: 15px;">📋 Flota en Tiempo Real</h2>
        <div id="contenido">
            <div class="loading">Cargando datos...</div>
        </div>
    </div>

    <script>
        // URLs REALES de Google Sheets Publicados
        const SHEETS = {
            'MALAGUEÑO': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRRekgbjI96zEJj2BQdGZ2ybRI_BqjvYgacBrFe2evrgk7Ojlo-dDT9GI8ZDgJXJU95FYwv7TreINqd/pub?gid=0&single=true&output=csv',
            'LA_PAMPITA': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRRekgbjI96zEJj2BQdGZ2ybRI_BqjvYgacBrFe2evrgk7Ojlo-dDT9GI8ZDgJXJU95FYwv7TreINqd/pub?gid=2135255296&single=true&output=csv',
            'BARKER': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRRekgbjI96zEJj2BQdGZ2ybRI_BqjvYgacBrFe2evrgk7Ojlo-dDT9GI8ZDgJXJU95FYwv7TreINqd/pub?gid=149809572&single=true&output=csv'
        };

        let sucursalActual = 'TODAS';

        function cargarSucursal(sucursal) {
            sucursalActual = sucursal;
            
            // Actualizar botones
            document.querySelectorAll('.btn-sucursal').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            cargarDatos();
        }

        async function cargarDatos() {
            const contenido = document.getElementById('contenido');
            contenido.innerHTML = '<div class="loading">Cargando datos...</div>';
            
            try {
                let datos = [];
                
                if (sucursalActual === 'TODAS') {
                    // Cargar todas las sucursales
                    for (const [sucursal, url] of Object.entries(SHEETS)) {
                        const response = await fetch(url);
                        const texto = await response.text();
                        const filas = parseCSV(texto);
                        datos = datos.concat(filas.map(f => ({...f, sucursal})));
                    }
                } else {
                    // Cargar sucursal específica
                    const response = await fetch(SHEETS[sucursalActual]);
                    const texto = await response.text();
                    datos = parseCSV(texto);
                }
                
                mostrarTabla(datos);
                
            } catch (error) {
                console.error('Error:', error);
                contenido.innerHTML = '<div class="loading" style="color: #f87171;">❌ Error al cargar datos<br>' + error.message + '</div>';
            }
        }

        function parseCSV(texto) {
            const lineas = texto.trim().split('\n');
            if (lineas.length < 2) return [];
            
            const headers = lineas[0].split(',').map(h => h.trim().replace(/"/g, ''));
            const datos = [];
            
            for (let i = 1; i < lineas.length; i++) {
                if (!lineas[i].trim()) continue;
                
                const valores = lineas[i].split(',').map(v => v.trim().replace(/"/g, ''));
                const fila = {};
                
                headers.forEach((header, index) => {
                    fila[header] = valores[index] || '';
                });
                
                // Solo agregar si tiene ID de equipo
                if (fila['ID_Equipo'] && fila['ID_Equipo'].trim()) {
                    datos.push(fila);
                }
            }
            
            return datos;
        }

        function mostrarTabla(datos) {
            const contenido = document.getElementById('contenido');
            
            if (datos.length === 0) {
                contenido.innerHTML = '<div class="loading">📭 No hay datos disponibles</div>';
                return;
            }
            
            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>📍 Sucursal</th>
                            <th>🔢 ID Equipo</th>
                            <th>🚜 Equipo</th>
                            <th>📊 Estado</th>
                            <th>⏱️ Horómetro/Km</th>
                            <th>👷 Reportante</th>
                            <th>📅 Fecha</th>
                            <th>⏱️ Tiempo Parada</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            
            datos.forEach(d => {
                const estado = (d.Estado || '').toUpperCase();
                let badgeClass = 'badge-activo';
                if (estado === 'PARADO') badgeClass = 'badge-parado';
                else if (estado === 'EN_SERVICE' || estado === 'MANTENIMIENTO') badgeClass = 'badge-service';
                
                const tiempoParada = calcularTiempoParada(d.Timestamp_Parada);
                
                html += `
                    <tr>
                        <td>${d.sucursal || sucursalActual}</td>
                        <td><strong>${d.ID_Equipo || '-'}</strong></td>
                        <td>${d.Equipo || '-'}</td>
                        <td><span class="badge ${badgeClass}">${d.Estado || '-'}</span></td>
                        <td>${d['Horó./Kilómetro'] || '-'} ${d.Lectura ? '(' + d.Lectura + ')' : ''}</td>
                        <td>${d.Reportante || '-'}</td>
                        <td>${d.Fecha_Carga || '-'}</td>
                        <td>${tiempoParada}</td>
                    </tr>
                `;
            });
            
            html += '</tbody></table>';
            contenido.innerHTML = html;
        }

        function calcularTiempoParada(timestamp) {
            if (!timestamp) return '-';
            
            try {
                const inicio = new Date(timestamp);
                const ahora = new Date();
                const diff = ahora - inicio;
                
                const horas = Math.floor(diff / 3600000);
                const minutos = Math.floor((diff % 3600000) / 60000);
                const segundos = Math.floor((diff % 60000) / 1000);
                
                return `${String(horas).padStart(2,'0')}:${String(minutos).padStart(2,'0')}:${String(segundos).padStart(2,'0')}`;
            } catch (e) {
                return '-';
            }
        }

        // Cargar datos al iniciar
        window.onload = () => cargarDatos();
        
        // Actualizar cada 30 segundos
        setInterval(cargarDatos, 30000);
    </script>
</body>
</html>
